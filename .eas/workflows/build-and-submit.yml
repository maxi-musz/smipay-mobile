name: Build and Submit

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS production
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android production
    type: build
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit iOS to App Store
    needs: [build_ios]
    type: submit
    params:
      platform: ios
      profile: production
      build_id: ${{ jobs.build_ios.outputs.build_id }}

  submit_android:
    name: Submit Android to Play Store
    needs: [build_android]
    type: submit
    params:
      platform: android
      profile: production
      build_id: ${{ jobs.build_android.outputs.build_id }}
